# tmux configuration file

# -----------------------------------------------------------------------------
# Core Settings

# bind prefix to C-Space
unbind C-b
set -g prefix C-Space

# Set the default terminal to tmux-256color
set -s default-terminal tmux-256color

# Enable true color support
set -g terminal-overrides ",tmux-256color:Tc"

# Enable extended keys (for Shift+Enter, etc.)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g allow-passthrough on

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Do not exit tmux when the last pane is closed
set -g detach-on-destroy off

# neovim settings
set-option -sg escape-time 10
set-option -g focus-events on

setw -g mode-keys vi
set-option -g status-keys vi

set -g mouse on

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g automatic-rename on

# -----------------------------------------------------------------------------
# Navigation

unbind r
bind r source-file ~/.tmux.conf \; display-message "Tmux Config Reloaded!"

# Session picker (tmux-sessionizer)
unbind f
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# Command palette
bind-key P display-popup -E -w 60% -h 60% "~/.local/bin/tmux-command-palette"

# Context capture -> Claude analysis (popup)
bind-key C display-popup -E -w 90% -h 80% "~/.local/bin/tmux-capture-context '#{pane_id}'"

# -----------------------------------------------------------------------------
# Splits

unbind v
unbind h
unbind % # Split vertically
unbind '"' # Split horizontally

bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# -----------------------------------------------------------------------------
# Window Management

# Switch between next/prev window
bind C-p previous-window
bind C-n next-window

# Reorder windows
bind-key -r '<' swap-window -t -1 \; select-window -t -1
bind-key -r '>' swap-window -t +1 \; select-window -t +1

# Toggle last window (quick switch between two windows)
bind-key Space last-window

# -----------------------------------------------------------------------------
# Pane Management

# Resize panes with prefix + arrow keys (repeatable)
bind-key -r Up resize-pane -U 5
bind-key -r Down resize-pane -D 5
bind-key -r Left resize-pane -L 5
bind-key -r Right resize-pane -R 5

# Synchronize panes toggle (type in all panes at once)
bind-key S set-window-option synchronize-panes \; display-message "Sync #{?synchronize-panes,ON,OFF}"

# Toggle mouse mode
bind-key m set-option -g mouse \; display-message "Mouse #{?mouse,ON,OFF}"

# -----------------------------------------------------------------------------
# Copy Mode (vi bindings)

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# -----------------------------------------------------------------------------
# Style

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_status_background "none"

# Put the status line at the top with a buffer line
set -g status-position top
set -g pane-border-status top
set -g pane-border-format "\u200b"

# Status bar: gitmux (git branch/status) + application + session
set -g status-right-length 120
set -g status-left-length 100
set -g status-left ""
set -g status-right "#(gitmux -cfg ~/.gitmux.conf '#{pane_current_path}')"
set -ag status-right " #{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"

# -----------------------------------------------------------------------------
# Plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'tmux-plugins/tmux-continuum'

# --- Resurrect: session persistence across reboots ---
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# --- Continuum: auto-save and auto-restore ---
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# --- Extrakto: fuzzy find and copy text from terminal output ---
set -g @extrakto_key 'tab'
set -g @extrakto_split_direction 'v'
set -g @extrakto_split_size '15'
set -g @extrakto_filter_order 'word line path url'

# --- Thumbs: letter hints for instant copy ---
set -g @thumbs-key 'T'
set -g @thumbs-command 'echo -n {} | pbcopy'
set -g @thumbs-upcase-command 'open {}'

# Initialize TMUX plugin manager (TPM) — must be last
run '/opt/homebrew/opt/tpm/share/tpm/tpm'
