tmux:
    symbols:
        branch: " "
        hashprefix: ":"
        ahead: "↑"
        behind: "↓"
        staged: "●"
        conflict: "✖"
        modified: "✚"
        untracked: "…"
        stashed: "⚑"
        clean: ""
    styles:
        clear: "#[fg=default]"
        state: "#[fg=#f38ba8,bold]"
        branch: "#[fg=#cba6f7,bold]"
        remote: "#[fg=#89b4fa]"
        divergence: "#[fg=#f5c2e7]"
        staged: "#[fg=#a6e3a1]"
        conflict: "#[fg=#f38ba8]"
        modified: "#[fg=#f9e2af]"
        untracked: "#[fg=#89b4fa]"
        stashed: "#[fg=#cba6f7]"
        clean: "#[fg=#a6e3a1]"
    layout: [branch, divergence, flags]
    options:
        branch_max_len: 30
        hide_clean: true
